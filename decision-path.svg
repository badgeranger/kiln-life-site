<svg width="720" height="560" viewBox="0 0 720 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">From scattered questions to one clear decision</title>
  <desc id="desc">Three ambiguous business questions become evidence, one highlighted decision, and a practical delivery path.</desc>
  <rect width="720" height="560" rx="2" fill="#25231F"/>
  <path d="M80 84H640" stroke="#686158" stroke-width="1"/>
  <text x="80" y="58" fill="#CFC6B8" font-family="Arial, sans-serif" font-size="13" letter-spacing="2">DECISION PATH</text>

  <g font-family="Arial, sans-serif">
    <circle cx="118" cy="166" r="30" stroke="#8B8377"/>
    <text x="118" y="171" text-anchor="middle" fill="#F3EBDD" font-size="18">?</text>
    <circle cx="118" cy="280" r="30" stroke="#8B8377"/>
    <text x="118" y="285" text-anchor="middle" fill="#F3EBDD" font-size="18">?</text>
    <circle cx="118" cy="394" r="30" stroke="#8B8377"/>
    <text x="118" y="399" text-anchor="middle" fill="#F3EBDD" font-size="18">?</text>

    <text x="170" y="159" fill="#F3EBDD" font-size="17">Which customer?</text>
    <text x="170" y="182" fill="#AFA79B" font-size="13">Market and demand uncertainty</text>
    <text x="170" y="273" fill="#F3EBDD" font-size="17">Which experience?</text>
    <text x="170" y="296" fill="#AFA79B" font-size="13">Promise and delivery gap</text>
    <text x="170" y="387" fill="#F3EBDD" font-size="17">Which AI opportunity?</text>
    <text x="170" y="410" fill="#AFA79B" font-size="13">Value, risk and feasibility</text>
  </g>

  <path d="M310 166C378 166 374 250 442 250M310 280H442M310 394C378 394 374 310 442 310" stroke="#8B8377" stroke-width="1.5"/>
  <circle cx="472" cy="280" r="64" fill="#D95C38"/>
  <text x="472" y="272" text-anchor="middle" fill="white" font-family="Georgia, serif" font-size="18">One clear</text>
  <text x="472" y="296" text-anchor="middle" fill="white" font-family="Georgia, serif" font-size="18">decision</text>

  <path d="M536 280H620" stroke="#F3EBDD" stroke-width="1.5"/>
  <path d="M610 270L620 280L610 290" stroke="#F3EBDD" stroke-width="1.5"/>
  <text x="580" y="255" text-anchor="middle" fill="#AFA79B" font-family="Arial, sans-serif" font-size="12">DELIVER</text>

  <rect x="80" y="470" width="560" height="1" fill="#686158"/>
  <text x="80" y="505" fill="#D95C38" font-family="Arial, sans-serif" font-size="12" letter-spacing="1.6">EVIDENCE BEFORE INVESTMENT</text>
  <text x="640" y="505" text-anchor="end" fill="#F3EBDD" font-family="Arial, sans-serif" font-size="12">kiln.</text>
</svg>
